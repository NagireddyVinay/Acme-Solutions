<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Acme Solutions — Contact</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="theme-light">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" class="logo"/><span>Acme Solutions</span></a>
      <nav class="main-nav" role="navigation" aria-label="Main">
        <button class="nav-toggle" aria-expanded="false" aria-controls="primary-menu">☰</button>
        <ul id="primary-menu" class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
        <button id="theme-toggle" class="theme-btn">🌓</button>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <section class="contact-hero">
      <h1>Get in touch</h1>
      <p>Fill out the form and we'll reply within 1 business day.</p>
    </section>

    <section class="contact-form">
      <form id="contactForm" novalidate>
        <div class="form-grid">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="company">Company</label>
          <input id="company" name="company" type="text" />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <div></div>
          <button class="btn primary" type="submit">Send Message</button>
        </div>

        <div id="formMessage" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div>
        <h3>Acme Solutions</h3>
        <p>123 Business St, City • <a href="mailto:hello@acme.example">hello@acme.example</a></p>
      </div>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
